name: Application checks
on:
  pull_request:
  push:
    branches: [main, staging]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      # Compiles real components with a fixture API. No cloud credentials/writes.
      - run: npx ng build --configuration=qa --output-path=dist/qa
