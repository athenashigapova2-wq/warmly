name: Android test APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - name: Configure public Supabase connection
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; import {publicConfig} from './Client/src/auth-utils.ts'; writeFileSync('Client/public/config.json', JSON.stringify(publicConfig(process.env.SUPABASE_URL || '', process.env.SUPABASE_PUBLISHABLE_KEY || '')));"
      - run: npm run android:sync
      - run: chmod +x android/gradlew
      - run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: warmly-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
